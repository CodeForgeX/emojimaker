<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Emoji Maker - Create Custom Emojis Free Online</title>
    <meta name="title" content="Emoji Maker - Create Custom Emojis Free Online" />
    <meta name="description" content="Create custom emojis online for free. Mix 100+ parts: heads, eyes, eyebrows, mouths. Export PNG/SVG instantly. No signup." />
    <meta name="author" content="Diu" />
    <meta name="language" content="English" />
    <link rel="canonical" href="https://emojimaker.cc/" />

    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Emoji Maker" />

    <!-- Security Headers - Note: X-Frame-Options and X-Content-Type-Options should be set via HTTP response headers, not meta tags -->
    <meta name="referrer" content="no-referrer-when-downgrade" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://emojimaker.cc/" />
    <meta property="og:title" content="Emoji Maker - Create Custom Emojis Free" />
    <meta property="og:description" content="Free online tool to create custom emojis. Mix and match 100+ parts. Export as PNG or SVG." />
    <meta property="og:image" content="https://emojimaker.cc/banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Emoji Maker interface showing customizable emoji parts" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Emoji Maker" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://emojimaker.cc/" />
    <meta name="twitter:title" content="Emoji Maker - Create Custom Emojis Free" />
    <meta name="twitter:description" content="Free tool to create custom emojis online. 100+ customizable parts. Export as PNG/SVG." />
    <meta name="twitter:image" content="https://emojimaker.cc/banner.png" />
    <meta name="twitter:image:alt" content="Emoji Maker preview" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- <link rel="apple-touch-icon" href="/apple-touch-icon.png" /> -->

    <!-- SEO Technical Tags -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="theme-color" content="#8b5cf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#6d28d9" media="(prefers-color-scheme: dark)" />

    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://emojimaker.cc/#webapp",
          "name": "Emoji Maker",
          "url": "https://emojimaker.cc/",
          "description": "Free online tool to create custom emojis. Mix and match head, eyes, eyebrows, mouth, and detail parts. Export as PNG or SVG.",
          "applicationCategory": "DesignApplication",
          "operatingSystem": "Any",
          "browserRequirements": "Requires JavaScript. Compatible with Chrome, Firefox, Safari, Edge.",
          "datePublished": "2024-01-01",
          "dateModified": "2025-10-01",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "availability": "https://schema.org/InStock"
          },
          "screenshot": "https://emojimaker.cc/banner.png",
          "image": "https://emojimaker.cc/banner.png",
          "featureList": [
            "Randomize emoji combinations",
            "Export as PNG (640x640)",
            "Export as SVG (vector format)",
            "5 customizable parts (head, eyes, eyebrows, mouth, details)",
            "Dark mode support",
            "No login required"
          ],
          "isBasedOn": {
            "@type": "CreativeWork",
            "name": "Microsoft Fluent Emoji",
            "url": "https://github.com/microsoft/fluentui-emoji",
            "license": "https://github.com/microsoft/fluentui-emoji/blob/main/LICENSE"
          },
          "inLanguage": "en-US",
          "isAccessibleForFree": true,
          "installUrl": "https://emojimaker.cc/",
          "softwareVersion": "1.0"
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://emojimaker.cc/#software",
          "name": "Emoji Maker",
          "applicationCategory": "GraphicsApplication",
          "programmingLanguage": "TypeScript",
          "operatingSystem": "Cross-platform",
          "softwareVersion": "1.0.0",
          "license": "https://opensource.org/licenses/MIT"
        },
        {
          "@type": "FAQPage",
          "@id": "https://emojimaker.cc/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What formats can I export my emoji in?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You can export your custom emoji as PNG (640x640 pixels) or SVG (scalable vector format). PNG is perfect for social media, messaging apps, and general use. SVG provides scalable vector graphics ideal for printing, large displays, or further editing."
              }
            },
            {
              "@type": "Question",
              "name": "Is Emoji Maker free to use?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, Emoji Maker is completely free and open source. No registration, subscription, or payment required. Access all features instantly without creating an account."
              }
            },
            {
              "@type": "Question",
              "name": "Can I use these emojis commercially?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! The emoji assets are open source under MIT License. You can use generated emojis freely for personal projects, commercial products, marketing materials, or any other purpose without attribution requirements."
              }
            },
            {
              "@type": "Question",
              "name": "How many emoji combinations are possible?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "With 8 head types, 26 eye styles, 6 eyebrow types, 40 mouth options, and 22 detail elements, you can create over 200,000 unique emoji combinations. Use the randomize button to discover new combinations instantly."
              }
            },
            {
              "@type": "Question",
              "name": "Do I need to install any software?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No installation required. Emoji Maker runs entirely in your web browser. Works on Chrome, Firefox, Safari, and Edge on desktop, tablet, or mobile devices."
              }
            }
          ]
        },
        {
          "@type": "BreadcrumbList",
          "@id": "https://emojimaker.cc/#breadcrumb",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://emojimaker.cc/"
            }
          ]
        }
      ]
    }
    </script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=<%= VITE_GTAG_ID %>"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', '<%= VITE_GTAG_ID %>');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
